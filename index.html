    { id: "infinitywar", t: "Avengers: Wojna bez granic", o: "Infinity War", y: "2018", type: "film", p: "disney", is: true, dd: true },
    { id: "endgame", t: "Avengers: Koniec gry", o: "Endgame", y: "2018–23", type: "film", p: "disney", is: true, dd: true },
  ]},
  { era: "Saga Multiwersum", sub: "po Blipie · 2023", items: [
    { id: "wandavision", t: "WandaVision", o: "WandaVision", y: "2023", type: "serial", p: "disney", dd: true },
    { id: "loki1", t: "Loki (sez. 1)", o: "Loki", y: "2023 / 2012", type: "serial", p: "disney", dd: true },
    { id: "loki2", t: "Loki (sez. 2)", o: "Loki", y: "2023", type: "serial", p: "disney", dd: true },
  ]},
  { era: "Saga Multiwersum", sub: "2024", items: [
    { id: "shangchi", t: "Shang-Chi i legenda dziesięciu pierścieni", o: "Shang-Chi", y: "2024", type: "film", p: "disney", dd: true },
    { id: "deadpool-wolverine", t: "Deadpool & Wolverine", o: "Deadpool & Wolverine", y: "2024", type: "film", p: "disney", dd: true },
    { id: "falcon-ws", t: "Falcon i Zimowy żołnierz", o: "Falcon & Winter Soldier", y: "2024", type: "serial", p: "disney", dd: true },
    { id: "spiderman-ffh", t: "Spider-Man: Daleko od domu", o: "Far From Home", y: "2024", type: "film", p: "netflix", note: "Epilog Sagi Nieskończoności" },
    { id: "spiderman-nwh", t: "Spider-Man: Bez drogi do domu", o: "No Way Home", y: "2024", type: "film", p: "wow", dd: true },
    { id: "eternals", t: "Eternals", o: "Eternals", y: "2024", type: "film", p: "disney", dd: true },
    { id: "hawkeye", t: "Hawkeye", o: "Hawkeye", y: "2024", type: "serial", p: "disney", dd: true },
    { id: "strange2", t: "Doktor Strange w multiwersum obłędu", o: "Multiverse of Madness", y: "2024", type: "film", p: "disney", dd: true },
  ]},
  { era: "Saga Multiwersum", sub: "2025", items: [
    { id: "moonknight", t: "Moon Knight", o: "Moon Knight", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "wakanda-forever", t: "Czarna Pantera: Wakanda w moim sercu", o: "Wakanda Forever", y: "2025", type: "film", p: "disney", dd: true },
    { id: "echo", t: "Echo", o: "Echo", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "shehulk", t: "Mecenas She-Hulk", o: "She-Hulk", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "msmarvel", t: "Ms. Marvel", o: "Ms. Marvel", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "marvels", t: "The Marvels", o: "The Marvels", y: "2025", type: "film", p: "disney", dd: true },
    { id: "thor4", t: "Thor: Miłość i grom", o: "Love and Thunder", y: "2025", type: "film", p: "disney", dd: true },
    { id: "ironheart", t: "Ironheart", o: "Ironheart", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "werewolf", t: "Wilkołak nocą", o: "Werewolf by Night", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "gotg-holiday", t: "Strażnicy Galaktyki: Świąteczny special", o: "Holiday Special", y: "2025", type: "serial", p: "disney", dd: true },
    { id: "ff4", t: "Fantastyczna Czwórka: Pierwsze kroki", o: "First Steps", y: "Earth-828", type: "film", p: "disney", dd: true, note: "Alternatywna oś (Earth-828) – wprost prowadzi do Doomsday" },
    { id: "wonderman", t: "Wonder Man", o: "Wonder Man", y: "2025–27", type: "serial", p: "disney", dd: true },
  ]},
  { era: "Saga Multiwersum", sub: "2026–2027", items: [
    { id: "quantumania", t: "Ant-Man i Osa: Kwantomania", o: "Quantumania", y: "2026", type: "film", p: "disney", dd: true },
    { id: "gotg3", t: "Strażnicy Galaktyki vol. 3", o: "Vol. 3", y: "2026", type: "film", p: "disney", dd: true },
    { id: "secret-invasion", t: "Tajna inwazja", o: "Secret Invasion", y: "2026", type: "serial", p: "disney", dd: true },
    { id: "agatha", t: "Agatha All Along", o: "Agatha All Along", y: "2026", type: "serial", p: "disney", dd: true },
    { id: "born-again1", t: "Daredevil: Odrodzenie (sez. 1)", o: "Born Again", y: "2026–27", type: "serial", p: "disney", dd: true },
    { id: "brave-new-world", t: "Kapitan Ameryka: Nowy wspaniały świat", o: "Brave New World", y: "2026–27", type: "film", p: "disney", dd: true },
    { id: "thunderbolts", t: "Thunderbolts*", o: "Thunderbolts*", y: "2027", type: "film", p: "disney", dd: true },
    { id: "punisher-special", t: "Punisher: One Last Kill", o: "Special", y: "2027", type: "serial", p: "disney", dd: true },
    { id: "born-again2", t: "Daredevil: Odrodzenie (sez. 2)", o: "Born Again", y: "2027", type: "serial", p: "disney", dd: true },
  ]},
];

const ALL_ITEMS = DATA.flatMap((g) => g.items);
const TOTAL = ALL_ITEMS.length;
const DD_TOTAL = ALL_ITEMS.filter((i) => i.dd).length;
const IS_TOTAL = ALL_ITEMS.filter((i) => i.is).length;
const GOLD = "#f0b232";
const CYAN = "#5fd6df";

function App() {
  const [watched, setWatched] = useState(new Set());
  const [loaded, setLoaded] = useState(false);
  const [filter, setFilter] = useState("all");

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setWatched(new Set(JSON.parse(raw)));
    } catch (e) {}
    setLoaded(true);
  }, []);

  const persist = (set) => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
  };

  const toggle = (id) => {
    setWatched((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      persist(next);
      return next;
    });
  };

  const resetAll = () => {
    if (!window.confirm("Odznaczyć wszystkie obejrzane pozycje?")) return;
    const empty = new Set();
    setWatched(empty);
    persist(empty);
  };

  const count = watched.size;
  const pct = Math.round((count / TOTAL) * 100);
  const ddDone = ALL_ITEMS.filter((i) => i.dd && watched.has(i.id)).length;
  const isDone = ALL_ITEMS.filter((i) => i.is && watched.has(i.id)).length;

  const groups = useMemo(() => {
    return DATA.map((g) => ({
      ...g,
      items: g.items.filter((it) => {
        const w = watched.has(it.id);
        if (filter === "watched") return w;
        if (filter === "unwatched") return !w;
        if (filter === "doomsday") return it.dd;
        if (filter === "infinity") return it.is;
        return true;
      }),
    })).filter((g) => g.items.length > 0);
  }, [filter, watched]);

  const focused = filter === "doomsday" || filter === "infinity";

  return (
    <div className="min-h-screen text-zinc-100" style={{background:"#08080b"}}>
      <div className="pointer-events-none fixed inset-0 z-0" style={{ background: "radial-gradient(1200px 500px at 50% -10%, rgba(230,36,41,.22), transparent 60%)" }} />
      <div className="relative z-10 max-w-3xl mx-auto px-4 pb-24">
        <header className="pt-8 pb-5">
          <p className="text-[#e62429] font-extrabold tracking-[.35em] text-xs uppercase mb-2">Marvel Cinematic Universe</p>
          <h1 className="display text-5xl sm:text-6xl leading-[0.92] text-white">Lista chronologiczna</h1>
          <p className="text-zinc-400 mt-3 text-sm leading-relaxed">
            Oś czasu wydarzeń · platformy dla <span className="text-zinc-200">Niemiec</span>. Plakietki: <span className="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded align-middle" style={{ background: "rgba(95,214,223,.14)", color: CYAN }}><InfinityIcon size={10} /> Infinity</span> = Saga Nieskończoności, <span className="inline-flex items-center gap-1 ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded align-middle" style={{ background: "rgba(240,178,50,.16)", color: GOLD }}><Zap size={10} fill={GOLD} /> Doomsday</span> = Saga Multiwersum.
          </p>
          <div className="flex flex-wrap items-center gap-2 mt-4">
            {Object.values(PLATFORMS).map((pl) => (
              <span key={pl.label} className="text-[11px] font-bold px-2.5 py-1 rounded-md" style={{ background: pl.bg, color: pl.color }}>{pl.label}</span>
            ))}
          </div>
        </header>

        <div className="sticky top-0 z-20 -mx-4 px-4 py-3 backdrop-blur border-b border-white/5" style={{background:"rgba(8,8,11,.92)"}}>
          <div className="flex items-end justify-between mb-2">
            <div className="flex items-baseline gap-2">
              <span className="display text-3xl" style={{color:GOLD}}>{count}</span>
              <span className="text-zinc-500 text-sm">/ {TOTAL}</span>
            </div>
            <span className="text-[11px] text-zinc-500 flex items-center gap-2">
              <span className="flex items-center gap-1" style={{ color: CYAN }}><InfinityIcon size={12} /> {isDone}/{IS_TOTAL}</span>
              <span className="text-zinc-700">·</span>
              <span className="flex items-center gap-1" style={{ color: GOLD }}><Zap size={12} fill={GOLD} /> {ddDone}/{DD_TOTAL}</span>
            </span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{background:"rgba(255,255,255,.08)"}}>
            <div className="h-full rounded-full transition-all duration-500" style={{ width: pct + "%", background: "linear-gradient(90deg,#e62429,#f0b232)" }} />
          </div>
          <div className="flex items-center gap-2 mt-3 flex-wrap">
            {[
              ["all", "Wszystko", null],
              ["unwatched", "Do obejrzenia", null],
              ["watched", "Obejrzane", null],
              ["infinity", "∞ Infinity Saga", CYAN],
              ["doomsday", "⚡ Doomsday", GOLD],
            ].map(([k, label, c]) => (
              <button key={k} onClick={() => setFilter(k)}
                className="text-xs font-bold px-3 py-1.5 rounded-full transition"
                style={filter === k ? { background: c || "#e62429", color: c ? "#000" : "#fff" } : { background: "rgba(255,255,255,.08)", color: "#d4d4d8" }}>
                {label}
              </button>
            ))}
            <button onClick={resetAll} className="ml-auto text-xs font-semibold text-zinc-500">Wyczyść</button>
          </div>
        </div>

        {!loaded ? (
          <div className="flex items-center justify-center gap-2 text-zinc-500 py-20"><Loader2 className="animate-spin" size={18} /> Wczytywanie…</div>
        ) : (
          <div className="mt-6 space-y-8">
            {groups.map((g, gi) => (
              <section key={gi}>
                <div className="flex items-baseline gap-3 mb-3">
                  <h2 className="display text-xl text-white uppercase">{g.era}</h2>
                  <span className="text-xs font-bold tracking-wide" style={{color:GOLD}}>{g.sub}</span>
                </div>
                <ul className="space-y-2">
                  {g.items.map((it) => {
                    const w = watched.has(it.id);
                    const pl = PLATFORMS[it.p];
                    let bg = "rgba(255,255,255,.04)", bd = "rgba(255,255,255,.1)";
                    if (w) { bg = "rgba(255,255,255,.02)"; bd = "rgba(255,255,255,.05)"; }
                    else if (it.dd) { bg = "rgba(240,178,50,.04)"; bd = "rgba(240,178,50,.35)"; }
                    else if (it.is) { bg = "rgba(95,214,223,.04)"; bd = "rgba(95,214,223,.3)"; }
                    return (
                      <li key={it.id}>
                        <button onClick={() => toggle(it.id)}
                          className="w-full flex items-center gap-3 text-left rounded-xl px-3 py-3 transition"
                          style={{background:bg, border:"1px solid " + bd}}>
                          <span className="shrink-0 grid place-items-center w-6 h-6 rounded-full transition" style={{
                            background: w ? "#e62429" : "transparent",
                            border: "2px solid " + (w ? "#e62429" : "#52525b")
                          }}>
                            {w && <Check size={15} className="text-white pop" />}
                          </span>
                          <span className="flex-1 min-w-0">
                            <span className="flex items-center gap-1.5 flex-wrap">
                              <span className="font-bold leading-snug" style={{
                                color: w ? "#71717a" : "#f4f4f5",
                                textDecoration: w ? "line-through" : "none"
                              }}>{it.t}</span>
                              {it.is && (
                                <span className="shrink-0 inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded" style={{ background: "rgba(95,214,223,.14)", color: CYAN, opacity: w ? 0.5 : 1 }}><InfinityIcon size={10} /> Infinity</span>
                              )}
                              {it.dd && (
                                <span className="shrink-0 inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded" style={{ background: "rgba(240,178,50,.16)", color: GOLD, opacity: w ? 0.5 : 1 }}><Zap size={10} fill={GOLD} /> Doomsday</span>
                              )}
                            </span>
                            <span className="flex items-center gap-2 mt-1">
                              <span className="shrink-0 text-zinc-600">{it.type === "film" ? <Film size={12} /> : <Tv2 size={12} />}</span>
                              <span className="text-xs text-zinc-500 truncate">{it.o}</span>
                              <span className="shrink-0 text-[10px] font-bold px-2 py-0.5 rounded" style={{ background: pl.bg, color: pl.color, opacity: w ? 0.5 : 1 }}>{pl.label}</span>
                            </span>
                            {it.note && <span className="block text-[10px] mt-1" style={{color:"rgba(245,158,11,.7)"}}>⚠ {it.note}</span>}
                          </span>
                          <span className="shrink-0 text-xs font-semibold text-zinc-500 tabular-nums w-16 text-right">{it.y}</span>
                        </button>
                      </li>
                    );
                  })}
                </ul>
              </section>
            ))}
            {groups.length === 0 && <p className="text-center text-zinc-500 py-16 text-sm">Nic tu nie ma w tym filtrze 🎬</p>}
          </div>
        )}

        {loaded && !focused && (
          <section className="mt-12">
            <div className="flex items-baseline gap-3 mb-1">
              <h2 className="display text-xl text-white uppercase">Zaplanowane</h2>
              <span className="text-xs font-bold tracking-wide" style={{color:GOLD}}>jeszcze nie premiera</span>
            </div>
            <p className="text-xs text-zinc-500 mb-4">Daty potrafią się przesuwać. Filmy = kino, seriale = Disney+.</p>
            <div className="overflow-hidden rounded-xl" style={{border:"1px solid rgba(255,255,255,.1)"}}>
              <table className="w-full text-sm border-collapse">
                <thead>
                  <tr className="text-zinc-400 text-[11px] uppercase tracking-wide" style={{background:"rgba(255,255,255,.05)"}}>
                    <th className="text-left font-bold px-3 py-2.5">Tytuł</th>
                    <th className="text-left font-bold px-2 py-2.5 hidden sm:table-cell">Gdzie</th>
                    <th className="text-right font-bold px-3 py-2.5">Premiera</th>
                  </tr>
                </thead>
                <tbody>
                  {[
                    { t: "X-Men '97 (sez. 2)", type: "serial", w: "Disney+", d: "lato 2026" },
                    { t: "Spider-Man: Brand New Day", type: "film", w: "kino", d: "31 lip 2026" },
                    { t: "VisionQuest", type: "serial", w: "Disney+", d: "14 paź 2026" },
                    { t: "Avengers: Doomsday", type: "film", w: "kino", d: "18 gru 2026", hot: true },
                    { t: "Daredevil: Odrodzenie (sez. 3)", type: "serial", w: "Disney+", d: "marzec 2027" },
                    { t: "Avengers: Secret Wars", type: "film", w: "kino", d: "17 gru 2027" },
                    { t: "Czarna Pantera 3", type: "film", w: "kino", d: "po Secret Wars (TBA)" },
                  ].map((r, i) => (
                    <tr key={i} style={{borderTop:"1px solid rgba(255,255,255,.05)"}}>
                      <td className="px-3 py-2.5">
                        <span className="flex items-center gap-2">
                          <span className="text-zinc-600 shrink-0">{r.type === "film" ? <Film size={12} /> : <Tv2 size={12} />}</span>
                          <span className="font-semibold" style={{color: r.hot ? GOLD : "#f4f4f5"}}>{r.t}</span>
                        </span>
                        <span className="sm:hidden text-[11px] text-zinc-500 ml-5">{r.w}</span>
                      </td>
                      <td className="px-2 py-2.5 text-zinc-400 hidden sm:table-cell">{r.w}</td>
                      <td className="px-3 py-2.5 text-right font-semibold whitespace-nowrap" style={{color:GOLD}}>{r.d}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}

        <footer className="mt-12 text-[11px] text-zinc-600 leading-relaxed space-y-2">
          <p><strong style={{ color: CYAN }}>∞ Infinity Saga (pełny wariant):</strong> komplet filmów Faz 1–3 — od Iron Mana po Koniec gry, ze wszystkimi solowymi originami. Daleko od domu to epilog (po Endgame).</p>
          <p><strong style={{ color: GOLD }}>⚡ Doomsday (pełny wariant):</strong> cała Saga Multiwersum (Fazy 4–6) — od WandaVision i No Way Home po Fantastyczną Czwórkę.</p>
          <p><strong className="text-zinc-500">Spider-Man (Sony):</strong> Homecoming i Daleko od domu – Netflix DE; Bez drogi do domu – WOW/Sky. Na Disney+ w Niemczech polski dubbing/napisy bywają tylko na profilu z regionem PL.</p>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
